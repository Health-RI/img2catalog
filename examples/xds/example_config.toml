[xds]
# minimum_unique_individuals = 10

# Map columns of the CSV file to properties of the dataset: "column header" = "property".
# The properties are those of the Health-RI dataset (e.g. description, keyword, landing_page, version, language).
# What is mapped replaces the value for that property from this configuration. Empty cells and columns that are
# not in the CSV file leave the value from the configuration as it is.
[xds.column_mapping]
"description" = "description"
"keywords" = "keyword"
# "datasetId" = "identifier"  # a stable identifier per row, so that a rerun updates the dataset in the FDP

# Separates the items in a cell for a property that is a list, like keyword. Default is ";"
# list_separator = ";"

[dataset]
identifier = "https://www.example.com/img-123"
description = "This is imaging data description"
theme = ["http://publications.europa.eu/resource/authority/data-theme/HEAL"]
keyword = ["list", "of", "key", "words"]
access_rights = "http://publications.europa.eu/resource/authority/access-right/PUBLIC"
applicable_legislation = ["http://publications.europa.eu/resource/authority/access-right/NON_PUBLIC"]

[dataset.publisher]
name = ["Example publisher list"]
identifier = ["http://example.com"]
mbox = "mailto:publisher@example.com"
homepage = "http://www.example.com"

[dataset.contact_point]
formatted_name = "Example Data Management office"
email = "mailto:datamanager@example.com"