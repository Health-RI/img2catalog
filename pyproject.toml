[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"


[project]
name = "img2catalog"
version = "2.0.0"
description = 'This tool generates RDF metadata from medical imaging respositories'
readme = "README.md"
requires-python = ">=3.8.1"
license = { text = "MIT License" }
keywords = []
authors = [{ name = "Mark Janse", email = "mark.janse@health-ri.nl" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "rdflib >= 7.0,< 7.7",
  "xnat ~= 0.6",
  "tqdm>=4.21",
  "tomli >= 1.10; python_version < '3.11'",
  "click >= 8.0.0",
  "click-option-group~=0.5.6",
  "sempyro == 2.1.0",
  "sparqlwrapper~=2.0",
  "fairclient >= 1.0.0",
  "pandas >= 2.0.0",
  "requests >= 2.34.2 ; python_version >= '3.10'",
  "requests >= 2.32.0 ; python_version < '3.10'",
]

[project.entry-points]
"xnat.cli" = { img2catalog = "img2catalog.cli_app:cli_click" }

[project.urls]
Documentation = "https://github.com/health-ri/img2catalog#readme"
Issues = "https://github.com/health-ri/img2catalog/issues"
Source = "https://github.com/health-ri/img2catalog"

[project.scripts]
img2catalog = "img2catalog.cli_app:cli_click"

[dependency-groups]
test = [
  "pytest",
  "pytest-mock",
  "requests-mock",
  "pytest-cov",
  "pytest-click",
  "pytest-repeat",
  "freezegun",
  "xnat4tests==0.3.12",
  "coverage",
]
lint = [
  "mypy>=1.0.0",
  "ruff>=0.16",
]

[tool.ruff]
target-version = "py38"
line-length = 120

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # Pyflakes
  "I",    # isort
  "N",    # pep8-naming
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "SIM",  # flake8-simplify
  "PTH",  # flake8-use-pathlib
  "ARG",  # flake8-unused-arguments
  "S",    # flake8-bandit
  "PT",   # flake8-pytest-style
  "RET",  # flake8-return
  "ERA",  # eradicate
  "T20",  # flake8-print
  "TID",  # flake8-tidy-imports
  "DTZ",  # flake8-datetimez
  "PERF", # Perflint
  "PL",   # Pylint
  "G",    # flake8-logging-format
  "SLF",  # flake8-self
  "RUF",  # Ruff-specific rules
]
ignore = [
  # CLI options and pytest fixtures naturally need more than 5 args; not worth restructuring
  # into config objects just to satisfy this.
  "PLR0913",
  "PLR0917",
  # Ditto for branch/return-statement counts in CLI dispatch and mapping functions.
  "PLR0911",
  "PLR0912",
  # False positives: these flag *_ENV constants (env var *names*, not secrets) and the
  # fixed "admin"/test credentials used to talk to the ephemeral xnat4tests container.
  "S105",
  "S106",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "S101",   # assert is the standard way to check expectations in pytest
  "ARG001", # unittest.mock/pytest inject fixture and mock args that a test may not reference
  "DTZ001", # test fixtures must mirror the naive datetimes the code under test actually produces
  "SLF001", # tests exercise private helper methods directly; they have no public equivalent
  "PLR2004", # test assertions compare against literal expected values, not shared constants
  "TID252", # tests import sibling test helpers (e.g. conftest) via relative imports
]
"src/img2catalog/cli_app.py" = [
  "ARG001", # cli_click(**kwargs) works around a click limitation, see https://github.com/pallets/click/issues/714
]
"src/img2catalog/logger.py" = [
  "N802", # setLevel mirrors the stdlib logging.Logger API this class wraps
]
"src/img2catalog/configmanager.py" = [
  # test_config_dir patches builtins.open and asserts the exact call signature
  # open(path, "rb"); switching to Path.open() changes that call shape and breaks it.
  "PTH123",
]
"src/img2catalog/inputs/xnat.py" = [
  "DTZ005", # stub `issued`/`modified` values (see TODO); tests freeze/compare them as naive datetimes
]
"src/img2catalog/mappings/xds.py" = [
  "DTZ007", # source format is a date only (no time-of-day or zone), so there is no zone to attach
]
"src/img2catalog/inputs/ega.py" = [
  "PERF203", # per-dataset error isolation; network I/O dominates cost, not the try/except
]

[tool.ruff.lint.isort]
known-first-party = ["img2catalog"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.coverage.run]
source_pkgs = ["img2catalog"]
branch = true
parallel = true
omit = ["src/img2catalog/__about__.py", "src/img2catalog/__main__.py", "tests/xnatpy_fixtures.py"]

[tool.coverage.paths]
img2catalog = ["src/img2catalog", "*/img2catalog/src/img2catalog"]
tests = ["tests", "*/img2catalog/tests"]

[tool.coverage.report]
exclude_lines = ["no cov", "if __name__ == .__main__.:", "if TYPE_CHECKING:"]

[tool.pytest.ini_options]
markers = [
    "integration: Runs integration tests."
]
