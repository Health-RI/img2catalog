# This workflow will install Python dependencies and run tests
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Run tests for Python

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@v6
    - name: Test with pytest
      run: |
        uv run --python ${{ matrix.python-version }} --group test coverage run -m pytest --doctest-modules --junitxml=junit/test-results.xml
        uv run --python ${{ matrix.python-version }} coverage combine || true
        uv run --python ${{ matrix.python-version }} coverage report
        uv run --python ${{ matrix.python-version }} coverage xml
    - name: SonarCloud Scan
      uses: SonarSource/sonarqube-scan-action@v8.0.0
      if: matrix.python-version == '3.10'
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Summary job that depends on all test jobs
  test-summary:
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "Tests failed"
            exit 1
          fi
          echo "All tests passed"
